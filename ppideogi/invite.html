<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta property="og:title" content="삐더기 같이 키우자!"><meta property="og:description" content="친구의 오리를 만나고 자동 대결을 해보세요."><title>삐더기 친구 초대</title><link rel="stylesheet" href="style.css"><main><div class="eyebrow">친구가 오리를 데려왔어</div><h1>우리 오리, 만나볼래?</h1><p id="message">친구 초대 링크를 확인하고 있어요.</p><div id="friend" class="id"></div><a id="open" class="button" hidden>삐더기에서 친구 만나기</a><p>앱이 이미 설치되어 있다면 위 버튼을 눌러주세요. 앱이 열리지 않으면 게임의 친구 화면에서 위 ID를 직접 입력할 수 있어요.</p><h2>아직 설치하지 않았다면</h2><p>현재 App Store 출시 준비 중이에요. 공개 후 이 페이지에 설치 버튼이 표시됩니다. 설치 후에는 이 초대 링크를 다시 열어주세요.</p><footer><a href="./">게임 소개·문의</a> · <a href="privacy.html">개인정보 처리방침</a></footer></main><script>const id=new URLSearchParams(location.search).get('friend');if(/^\d{6}$/.test(id||'')){document.querySelector('#friend').textContent=id;document.querySelector('#message').textContent='나의 친구 ID야. 밥도 주고, 대결도 하자!';const a=document.querySelector('#open');a.href='ppideogi://invite?friend='+id;a.hidden=false;}else{document.querySelector('#message').textContent='올바르지 않은 초대 링크예요. 친구에게 게임의 공유 버튼으로 링크를 다시 보내달라고 해주세요.';}</script></html>
